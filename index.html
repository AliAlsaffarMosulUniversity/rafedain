<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="شركة أناقة الرافدين للأثاث في الموصل — أثاث منزلي ومكتبي ومعدني وكهربائيات، جملة ومفرد، وتجهيز دوائر الدولة.">
<meta property="og:title" content="أناقة الرافدين للأثاث">
<meta property="og:description" content="تجارة كافة أنواع الأثاث ومن مختلف المناشئ — الموصل، الدركزلية">
<meta property="og:image" content="img/hero.jpg">
<link rel="icon" href="img/mark.png">
<link rel="apple-touch-icon" href="img/mark.png">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>أناقة الرافدين للأثاث</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=Marcellus&display=swap">
<style id="site-css">
/* Layout: lilac-and-white showroom catalogue; one wide column with a sticky header, image-led sections, admin as a side drawer */
:root{
  --bg:#fcfbfe; --surface:#ffffff; --lilac:#8b68c6; --lilac-deep:#5e3f99; --lilac-soft:#f1ebfa; --lilac-line:#e2d6f3;
  --ink:#221a33; --muted:#6c6382; --gold:#b48a3c; --ok:#2f8f5b; --danger:#b3404a;
  --f-display:"El Messiri","Marcellus",Georgia,serif; --f-body:"Tajawal",system-ui,sans-serif; --f-en-display:"Marcellus","El Messiri",Georgia,serif;
  --r:16px; --shadow:0 18px 40px -22px rgba(64,36,120,.35);
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
*{box-sizing:border-box}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[lang=en] .disp{font-family:var(--f-en-display);letter-spacing:.01em}
.disp{font-family:var(--f-display);text-wrap:balance;line-height:1.25}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(252,251,254,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--lilac-line)}
.hdr .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand img{width:50px;height:50px;object-fit:cover;border-radius:50%;box-shadow:0 0 0 2px var(--lilac-soft),0 6px 14px -6px rgba(40,20,80,.5)}
.brand b{font-family:var(--f-display);font-size:19px;line-height:1.2;color:var(--lilac-deep);white-space:nowrap}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:500;color:var(--muted)}
.nav a:hover{background:var(--lilac-soft);color:var(--lilac-deep)}
.hbtns{display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--lilac-line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;color:var(--lilac-deep)}
.menu-btn{display:none;border:1px solid var(--lilac-line);background:var(--surface);border-radius:12px;width:42px;height:42px;align-items:center;justify-content:center}
.menu-btn svg{width:22px;height:22px;stroke:var(--lilac-deep)}
@media (max-width:900px){
  .nav{display:none;position:absolute;top:100%;inset-inline:0;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--lilac-line);padding:8px max(16px,env(safe-area-inset-left,0px)) 14px;margin:0}
  .nav.open{display:flex}
  .menu-btn{display:inline-flex;margin-inline-start:auto}
  .hbtns .btn-wa{display:none}
}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;text-decoration:none;font-size:16px}
.btn svg{width:20px;height:20px;flex:none}
.btn-p{background:var(--lilac);color:#fff;box-shadow:0 10px 24px -12px rgba(94,63,153,.7)}
.btn-p:hover{background:var(--lilac-deep)}
.btn-o{background:var(--surface);color:var(--lilac-deep);border:1.5px solid var(--lilac-line)}
.btn-o:hover{border-color:var(--lilac)}
.btn-sm{padding:8px 14px;font-size:14px}

/* hero */
.hero{padding-block:28px 10px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(34px,5.2vw,64px);margin:0;color:var(--ink)}
.hero h1 em{font-style:normal;color:var(--lilac)}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin:14px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{background:var(--lilac-soft);color:var(--lilac-deep);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-img{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/3;box-shadow:var(--shadow);max-width:100%}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img .tag{position:absolute;inset-inline-start:16px;bottom:16px;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.hero-img .tag img{width:46px;height:46px;object-fit:cover;border-radius:50%}
.hero-img .tag b{font-family:var(--f-display);color:var(--lilac-deep);font-size:15px;line-height:1.3}
.hero-img .tag span{display:block;font-size:12px;color:var(--muted)}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-img{order:-1}}

/* sections */
section{padding-block:56px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:26px}
.eyebrow{font-size:13px;font-weight:800;color:var(--lilac);letter-spacing:.04em}
.sec-head h2{font-size:clamp(26px,3.4vw,40px);margin:4px 0 0}
.sec-head p{margin:0;color:var(--muted);max-width:56ch}
.band{background:linear-gradient(180deg,var(--lilac-soft),rgba(241,235,250,0))}

/* departments */
.depts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dept{background:var(--surface);border:1px solid var(--lilac-line);border-radius:var(--r);padding:22px 18px;text-align:center;text-decoration:none;transition:transform .2s,border-color .2s}
.dept:hover{transform:translateY(-3px);border-color:var(--lilac)}
.dept svg{width:44px;height:44px;stroke:var(--lilac-deep);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dept b{display:block;font-family:var(--f-display);font-size:22px;margin-top:6px}
.dept span{font-size:14px;color:var(--muted)}
@media (max-width:760px){.depts{grid-template-columns:repeat(2,1fr)}}

/* products */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:thin}
.filters button{flex:none;border:1.5px solid var(--lilac-line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--muted)}
.filters button[aria-pressed=true]{background:var(--lilac);border-color:var(--lilac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--lilac-line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;text-align:start;padding:0;transition:box-shadow .2s,transform .2s;color:inherit}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:var(--lilac-soft);overflow:hidden;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .cat{font-size:12px;font-weight:800;color:var(--lilac)}
.card .nm{font-weight:700;font-size:17px;line-height:1.4}
.card .md{font-size:13px;color:var(--muted)}
.card .md bdi{font-weight:800;color:var(--ink);letter-spacing:.03em}
.empty{border:1.5px dashed var(--lilac-line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}

/* why */
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.why div{background:var(--surface);border-radius:var(--r);padding:20px;border:1px solid var(--lilac-line)}
.why b{display:block;font-family:var(--f-display);font-size:20px;color:var(--lilac-deep);margin-bottom:4px}
.why p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:900px){.why{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.why{grid-template-columns:1fr}}

/* about + video */
.about{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.about p{color:var(--muted);font-size:17px;max-width:60ch}
.vid{border-radius:20px;overflow:hidden;background:#140f1f;box-shadow:var(--shadow);aspect-ratio:16/9;max-width:100%}
.vid video{width:100%;height:100%;display:block}
@media (max-width:860px){.about{grid-template-columns:1fr}}

/* gallery */
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:220px;gap:12px}
.gal button{border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--lilac-soft)}
.gal button:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:150px}.gal button:first-child{grid-column:span 2;grid-row:span 1}}

/* contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.cbox{background:var(--surface);border:1px solid var(--lilac-line);border-radius:22px;padding:24px;min-width:0}
.wa-big{display:flex;align-items:center;gap:14px;background:var(--lilac);color:#fff;border-radius:18px;padding:16px 20px;text-decoration:none;margin-bottom:16px}
.wa-big svg{width:36px;height:36px;flex:none;stroke:#fff;fill:none;stroke-width:1.8}
.wa-big small{display:block;opacity:.85;font-size:14px}
.wa-big b{font-size:24px;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:var(--lilac-soft);min-width:0}
.row .v{direction:ltr;unicode-bidi:isolate;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;min-width:0}
.row .k{font-size:13px;color:var(--muted)}
.copy{border:0;background:var(--surface);color:var(--lilac-deep);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;flex:none}
.racts{display:flex;gap:6px;flex:none}
.act{display:inline-flex;align-items:center;gap:6px;background:var(--lilac);color:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;text-decoration:none;flex:none}
.act:hover{background:var(--lilac-deep)}
.act svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row{flex-wrap:wrap}
.row .v{white-space:nowrap;flex:1 1 auto}
.wa-big b{white-space:nowrap;font-size:clamp(19px,5.5vw,24px)}
@media (max-width:480px){.cbox{padding:16px}.row .v{white-space:normal;overflow-wrap:anywhere}.row .v:not(:has(+ .racts a[href^=mailto])){white-space:nowrap}}
.side{display:flex;flex-direction:column;gap:14px}
.qr{display:flex;gap:16px;align-items:center}
.qr canvas,.qr .qrbox{width:132px;height:132px;flex:none;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--lilac-line)}
.qr .qrbox img{width:100%;height:100%;display:block;image-rendering:pixelated}
.addr{display:flex;gap:10px;align-items:flex-start}
.addr svg{width:24px;height:24px;stroke:var(--lilac-deep);fill:none;stroke-width:1.8;flex:none;margin-top:3px}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

footer{border-top:1px solid var(--lilac-line);padding-block:26px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;align-items:center}
footer bdi{direction:ltr}
.admin-link{border:1px solid var(--lilac-line);background:var(--surface);border-radius:999px;padding:6px 14px;color:var(--lilac-deep);font-weight:700}

/* floating whatsapp */
.fab{position:fixed;inset-inline-end:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;width:58px;height:58px;border-radius:50%;background:var(--lilac);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px -10px rgba(94,63,153,.8)}
.fab svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(26,18,40,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--surface);border-radius:22px;max-width:920px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:1.3fr 1fr}
.mbox img{width:100%;height:100%;object-fit:cover;display:block;min-height:280px;max-height:80vh}
.mbox .mi{padding:24px;display:flex;flex-direction:column;gap:10px}
.mbox h3{font-size:28px;margin:0}
.xbtn{align-self:flex-end;border:0;background:var(--lilac-soft);color:var(--lilac-deep);width:38px;height:38px;border-radius:50%;font-size:20px;line-height:1}
@media (max-width:760px){.mbox{grid-template-columns:1fr}.mbox img{max-height:50vh}}

/* admin */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);z-index:70;background:var(--surface);box-shadow:-20px 0 50px -20px rgba(40,20,80,.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--lilac-line)}
.dh b{font-family:var(--f-display);font-size:20px;color:var(--lilac-deep);margin-inline-end:auto}
.tabs{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--lilac-line);overflow-x:auto}
.tabs button{flex:none;border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--lilac-soft);color:var(--lilac-deep)}
.dbody{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dfoot{border-top:1px solid var(--lilac-line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dfoot .st{font-size:14px;color:var(--muted);margin-inline-end:auto}
.dfoot .st.dirty{color:var(--gold);font-weight:700}
.dfoot .st.err{color:var(--danger);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select{font:inherit;font-size:15px;border:1.5px solid var(--lilac-line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--lilac);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
.pitem{border:1px solid var(--lilac-line);border-radius:14px;padding:12px;display:grid;grid-template-columns:96px 1fr;gap:12px}
.pitem .th{width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--lilac-soft)}
.pitem .acts{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.mini{border:1px solid var(--lilac-line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--lilac-deep)}
.mini.del{color:var(--danger)}
.mini.yes{background:var(--danger);color:#fff;border-color:var(--danger)}
.note{background:var(--lilac-soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--lilac-deep)}
.gitem{display:flex;gap:10px;align-items:center}
.gitem img{width:90px;height:64px;object-fit:cover;border-radius:8px}
.fileb{position:relative;overflow:hidden}
.fileb input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px}
[dir=rtl] .toast{transform:translateX(50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function downscale(file){
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)/.test(file.type)) return res(file);
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){ var m=1600, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,m/Math.max(w,h));
      var c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){ res(b||file); }, file.type==='image/png'?'image/png':'image/jpeg', .86); };
    img.onerror=function(){ res(file); }; img.src=url;
  });
}
function handleUpload(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var a=A[lang], target=input.dataset.upimg;
  if(!assetsNS){ toast(a.noup); return; }
  toast(a.uploading);
  downscale(f).then(function(b){ return assetsNS.upload(b); }).then(function(r){
    var url=r.url;
    if(target==='hero') draft.media.hero=url;
    else if(target==='logo'){ draft.media.mark=url; draft.media.logo=url; }
    else if(target==='video') draft.media.video=url;
    else if(target==='gal') draft.media.gallery.push(url);
    else if(target.indexOf('p:')===0) draft.products[+target.slice(2)].img=url;
    markDirty(); render();
  }).catch(function(){ toast(a.upfail); });
}

  var act=el.dataset.act, i=+el.dataset.i, d=draft;
  if(el.dataset.tab){ tab=el.dataset.tab; pendingDel=null; renderDrawer(); return; }
  if(act==='close'){ closeDrawer(); return; }
  if(act==='addp'){ d.products.unshift({id:uid(),cat:(filter!=='all'?filter:d.cats[0].id),model:'',ar:'منتج جديد',en:'New product',img:d.media.hero}); markDirty(); render(); return; }
  if(act==='up'&&i>0){ var x=d.products.splice(i,1)[0]; d.products.splice(i-1,0,x); markDirty(); render(); return; }
  if(act==='down'&&i<d.products.length-1){ var y=d.products.splice(i,1)[0]; d.products.splice(i+1,0,y); markDirty(); render(); return; }
  if(act==='del'){ pendingDel=el.dataset.id; renderDrawer(); return; }
  if(act==='delno'){ pendingDel=null; renderDrawer(); return; }
  if(act==='delyes'){ d.products.splice(i,1); pendingDel=null; markDirty(); render(); return; }
  if(act==='gdel'){ d.media.gallery.splice(i,1); markDirty(); render(); return; }
  if(act==='cadd'){ d.cats.push({id:'c'+Date.now().toString(36),ar:'فئة جديدة',en:'New category'}); markDirty(); render(); return; }
  if(act==='cdel'){ d.cats.splice(i,1); markDirty(); render(); return; }
  if(act==='publish'){ doPublish(el); return; }
});

function buildDoc(state){
  var json=JSON.stringify(state).replace(/</g,'\\u003c');

  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+SKEL_CSS+'</style></head><body>'+
    head+'<style id="site-css">'+CSS+'</style>\n<script type="application/json" id="site-data">'+json+'<\/script>\n<div id="app"></div>\n'+
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"><\/script>\n<script id="site-js">'+SELF+'<\/script></body></html>';
}
function doPublish(btn){
  var a=A[lang];
  if(!artifactNS){ status='err'; statusMsg=a.readonly; renderDrawer(); return; }
  btn.disabled=true; var st=document.getElementById('stat'); if(st){ st.textContent=a.saving; st.className='st'; }
  try{sessionStorage.setItem('rf-draft',JSON.stringify(draft));}catch(e){}
  try{sessionStorage.setItem('rf-admin-open','1');}catch(e){}
  artifactNS.publish(buildDoc(draft)).then(function(){
    try{sessionStorage.removeItem('rf-draft');}catch(e){}
  }).catch(function(err){
    var code=err&&err.code;
    if(code==='conflict'){ status='err'; statusMsg=a.conflict; }
    else if(code==='not_writer'||code==='not_granted'){ status='err'; statusMsg=a.readonly; try{sessionStorage.removeItem('rf-admin-open');}catch(e){} }
    else { status='err'; statusMsg=a.failed; try{sessionStorage.removeItem('rf-admin-open');}catch(e){} }
    renderDrawer();
  });
}

if(window.claude && typeof window.claude.use==='function'){
  Promise.all([window.claude.use('artifact'),window.claude.use('user'),window.claude.use('assets')]).then(function(r){
    artifactNS=r[0]; var user=r[1]; assetsNS=r[2];
    var can=false; try{ can = (user && user.canEdit) ? user.canEdit() : false; }catch(e){}
    Promise.resolve(can).catch(function(){return false;}).then(function(ok){
      isAdmin = !!(artifactNS && ok);
      if(!isAdmin) return;
      var saved=null, reopen=false;
      try{ saved=sessionStorage.getItem('rf-draft'); reopen=sessionStorage.getItem('rf-admin-open')==='1'; sessionStorage.removeItem('rf-admin-open'); }catch(e){}
      if(saved){ try{ draft=JSON.parse(saved); dirty=true; }catch(e){ draft=null; } }
      render();
      if(draft||reopen){ openDrawer(); if(saved) toast(A[lang].restore); }
    });
  }).catch(function(){});
}
})();
</script>
